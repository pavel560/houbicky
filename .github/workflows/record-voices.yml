# Record the spoken lines and COMMIT them to git (voice/<lang>/*.mp3 + voice/index.json), so deploys never need a
# TTS service again (edge-tts is blocked from GitHub runners; ElevenLabs is a paid plan that will end).
#   - manual: Actions → "Record voices" → Run workflow → branch = main | v2
#   - automatic on v2 when the lines or the voice config change
# First run per branch: the current recordings (Vlasta / Maisie) are taken from the pages.yml voice cache, so nothing
# that exists today is lost; only missing or changed lines are recorded (voice/config.json decides the provider).
name: Record voices

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to record and commit'
        type: choice
        options: [v2, main]
        default: v2
  push:
    branches: [v2]
    paths:
      - voice/config.json
      - js/phrases.js
      - js/i18n.js
      - data/species.json

permissions:
  contents: write     # commit the recordings
  actions: write      # re-deploy (dispatch pages.yml)

concurrency:
  group: record-voices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      B: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
    steps:
      - name: Check out the branch (into a folder named like the branch, so the voice cache paths match pages.yml)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.B }}
          path: ${{ env.B }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install edge-tts (English Maisie; may be blocked, then only the cache counts)
        run: pip install edge-tts
        continue-on-error: true

      - name: Export the phrase catalogue
        working-directory: ${{ env.B }}
        run: node dev/export_phrases.mjs

      - name: Recordings already in git?
        id: committed
        run: |
          if ls "$B"/voice/cs/*.mp3 >/dev/null 2>&1 || ls "$B"/voice/en/*.mp3 >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take over the existing recordings from the pages.yml voice cache (first run only)
        if: steps.committed.outputs.yes != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.B }}/voice/cs
            ${{ env.B }}/voice/en
            ${{ env.B }}/voice/index.json
          key: ${{ env.B }}-voice-${{ hashFiles(format('{0}/voice/phrases.json', env.B)) }}
          restore-keys: ${{ env.B }}-voice-

      - name: Record missing / changed lines
        working-directory: ${{ env.B }}
        run: python make_voice.py
        continue-on-error: true          # lines that cannot be recorded fall back to the browser voice; commit the rest
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Check the recordings before committing
        working-directory: ${{ env.B }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          idx = json.load(open("voice/index.json", encoding="utf-8")) if os.path.exists("voice/index.json") else {}
          missing = [e["file"] for lang in idx.values() for e in lang.values() if not os.path.isfile(os.path.join("voice", e["file"]))]
          n = sum(len(v) for v in idx.values())
          size = sum(os.path.getsize(os.path.join(r, f)) for d in ("voice/cs", "voice/en") if os.path.isdir(d) for r, _, fs in os.walk(d) for f in fs)
          print(f"index: {n} recordings, {size / 1e6:.1f} MB on disk")
          for f in missing: print(f"::error::index.json points to a missing file: {f}")
          sys.exit(1 if missing else 0)
          PY

      - name: Commit the recordings
        id: commit
        working-directory: ${{ env.B }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          mkdir -p voice/cs voice/en
          git add -f --all voice/cs voice/en voice/index.json      # -f: main's .gitignore may still ignore them
          if git diff --cached --quiet; then
            echo "Nothing new to commit."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "Hlasy: nahrávky v gitu ($B) [record-voices]"
          for i in 1 2 3; do
            if git push origin "HEAD:$B"; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin "$B" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Re-deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
