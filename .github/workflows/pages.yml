# Houbičky → GitHub Pages.
#   main → https://<user>.github.io/houbicky/        (stable)
#   v2   → https://<user>.github.io/houbicky/beta/   (beta; skipped if the branch does not exist)
# One artifact holds both. A push to EITHER branch rebuilds both, so this file is identical on main and v2.
# The github-pages environment only accepts deployments from main, so a push to v2 just dispatches this
# workflow on main (job trigger-main); the main run then builds and deploys both copies.
# Photos (Wikimedia Commons) and voices (edge-tts) are generated here per branch, never committed.
# The two copies never interfere at runtime: different localStorage key, SW scope and cache names
# (all derived from the URL by js/env.js and sw.js).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  trigger-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the deploy on main (builds main + v2)
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Does the beta branch exist?
        id: beta
        run: |
          if git -C main ls-remote --exit-code --heads origin v2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No v2 branch: deploying the stable site only."
          fi

      - name: Check out v2 (beta)
        id: v2checkout
        if: steps.beta.outputs.exists == 'true'
        continue-on-error: true          # every v2 step is best-effort: a broken beta must never block the stable deploy
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install edge-tts
        run: pip install edge-tts

      # ---------------------------------------------------------------- stable (main)
      - name: "main: export the phrase catalogue"
        working-directory: main
        run: node dev/export_phrases.mjs

      - name: "main: restore photos"
        uses: actions/cache@v4
        with:
          path: |
            main/photos/*.jpg
            main/photos/credits.json
          key: main-photos-${{ hashFiles('main/photos/manifest.json') }}
          restore-keys: main-photos-

      - name: "main: committed recordings?"
        id: mainvoices
        # runs always (main is the stable copy)
        run: |
          if ls main/voice/cs/*.mp3 >/dev/null 2>&1 || ls main/voice/en/*.mp3 >/dev/null 2>&1; then
            echo "committed=true" >> "$GITHUB_OUTPUT"; echo "main: using the recordings committed in git (no voice cache)"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "main: restore voices"
        if: steps.mainvoices.outputs.committed != 'true'    # transitional: until record-voices.yml has committed them
        uses: actions/cache@v4
        with:
          path: |
            main/voice/cs
            main/voice/en
            main/voice/index.json
          key: main-voice-${{ hashFiles('main/voice/phrases.json') }}
          restore-keys: main-voice-

      - name: "main: fetch photos (only missing ones)"
        working-directory: main
        run: python fetch_photos.py
        continue-on-error: true          # a missing photo shows „Fotka zatím chybí“; never block a deploy
        env:
          HOUBICKY_CONTACT: ${{ vars.HOUBICKY_CONTACT }}

      # Deploys never use a paid TTS service (no ElevenLabs key here): recordings come from git (record-voices.yml).
      # This step only fills gaps with free edge-tts, and makes no network call when every line is already recorded.
      - name: "main: record voices (only new or changed lines)"
        working-directory: main
        run: python make_voice.py
        continue-on-error: true          # a missing recording falls back to the browser voice

      # ---------------------------------------------------------------- beta (v2)
      - name: "v2: export the phrase catalogue"
        id: v2export
        if: steps.beta.outputs.exists == 'true' && steps.v2checkout.outcome == 'success'
        continue-on-error: true
        working-directory: v2
        run: node dev/export_phrases.mjs

      - name: "v2: restore photos"
        if: steps.v2export.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            v2/photos/*.jpg
            v2/photos/credits.json
          key: v2-photos-${{ hashFiles('v2/photos/manifest.json') }}
          restore-keys: v2-photos-

      - name: "v2: committed recordings?"
        id: v2voices
        if: steps.v2export.outcome == 'success'
        run: |
          if ls v2/voice/cs/*.mp3 >/dev/null 2>&1 || ls v2/voice/en/*.mp3 >/dev/null 2>&1; then
            echo "committed=true" >> "$GITHUB_OUTPUT"; echo "v2: using the recordings committed in git (no voice cache)"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "v2: restore voices"
        if: steps.v2export.outcome == 'success' && steps.v2voices.outputs.committed != 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            v2/voice/cs
            v2/voice/en
            v2/voice/index.json
          key: v2-voice-${{ hashFiles('v2/voice/phrases.json') }}
          restore-keys: v2-voice-

      - name: "v2: fetch photos (only missing ones)"
        if: steps.v2export.outcome == 'success'
        working-directory: v2
        run: python fetch_photos.py
        continue-on-error: true
        env:
          HOUBICKY_CONTACT: ${{ vars.HOUBICKY_CONTACT }}

      - name: "v2: record voices (only new or changed lines)"
        if: steps.v2export.outcome == 'success'
        working-directory: v2
        run: python make_voice.py
        continue-on-error: true

      # ---------------------------------------------------------------- one artifact
      - name: Assemble the site (stable at /, beta at /beta/)
        env:
          HAS_BETA: ${{ steps.v2export.outcome == 'success' }}   # the beta is copied only if its checkout + export worked
        run: |
          copy_site() {   # copy_site <checkout> <destination>
            mkdir -p "$2"
            rsync -a \
              --exclude '.git' --exclude '.github' --exclude '.gitignore' \
              --exclude 'dev/' --exclude 'tests/' --exclude '__pycache__/' --exclude 'beta/' \
              --exclude 'design/*.png' --exclude 'design/*.md' --exclude '*.py' \
              --exclude 'BRIEF*.md' --exclude 'README.md' --exclude 'start.command' --exclude 'package.json' \
              --exclude 'voice/phrases.json' --exclude '*.part' --exclude '*.part.mp3' \
              "$1/" "$2/"
          }
          rm -rf _site
          copy_site main _site
          if [ "$HAS_BETA" = "true" ]; then
            copy_site v2 _site/beta
            # a separate home-screen name for the beta copy (the app itself derives "beta" from its URL)
            python3 - <<'PY'
          import json
          p = "_site/beta/manifest.webmanifest"
          m = json.load(open(p, encoding="utf-8"))
          m["name"] = m.get("name", "Houbičky") + " beta"
          m["short_name"] = m.get("short_name", "Houbičky") + " β"
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          # the iOS home-screen title comes from index.html, not from the manifest
          p = "_site/beta/index.html"
          html = open(p, encoding="utf-8").read()
          html = html.replace('name="apple-mobile-web-app-title" content="Houbičky"', 'name="apple-mobile-web-app-title" content="Houbičky beta"')
          open(p, "w", encoding="utf-8").write(html)
          PY
          fi
          for d in _site _site/beta; do
            [ -d "$d" ] || continue
            echo "$d: $(find "$d" -mindepth 1 \( -path "$d/beta" -prune \) -o -type f -print | wc -l) files," \
                 "photos $(ls "$d"/photos/*.jpg 2>/dev/null | wc -l), voices $(find "$d/voice" -name '*.mp3' 2>/dev/null | wc -l)"
          done

      - name: Smoke test (every service-worker core file exists; fails only for the stable copy)
        run: |
          python3 - <<'PY'
          import os, re, sys
          def missing(root):
              sw = open(os.path.join(root, "sw.js"), encoding="utf-8").read()
              core = re.search(r"const CORE = \[(.*?)\];", sw, re.S).group(1)
              paths = [p for p in re.findall(r"'\./([^']*)'", core) if p]
              return [p for p in paths if not os.path.isfile(os.path.join(root, p))]
          bad = missing("_site")
          for p in bad: print(f"::error::stable copy is missing {p}")
          if os.path.isdir("_site/beta"):
              for p in missing("_site/beta"): print(f"::warning::beta copy is missing {p} (offline install of the beta will fail)")
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
